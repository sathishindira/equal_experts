name: Pylint

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    environment: Dev

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:

    - name: checkout the code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install -r requirements.txt

    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6.0.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
          args: >
            -Dsonar.organization=sathishindira
            -Dsonar.projectKey=sathishindira_equal_experts
            -Dsonar.sources=.

    - name: Test the app.py file with test cases
      run: pytest test_app.py

    -   name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

    -   name: Set up QEMU
        uses: docker/setup-qemu-action@v3

    -   name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

    -   name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 'docker.io/sathishindira/github_actions:${{ github.sha }}'

    -   name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'docker.io/sathishindira/github_actions:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'